<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Office of Example — Contact the 508 program manager</title>
</head>
<body>
  <a href="#main">Skip to main content</a>
  <header>
    <nav aria-label="Primary">
      <a href="/">Office of Example home</a>
    </nav>
  </header>
  <main id="main">
    <h1>Contact the 508 program manager</h1>
    <p>Use this form to request an accessibility review of public-facing content.</p>
    <img src="diagram.png" alt="Flowchart of the review request: submit, triage, draft report, human sign-off.">
    <form action="/submit" method="post">
      <label for="email">Work email</label>
      <input id="email" name="email" type="email" required>
      <button type="submit">Submit review request</button>
    </form>
  </main>
</body>
</html>
